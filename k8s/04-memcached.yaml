apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
    spec:
      containers:
        - name: memcached
          image: memcached:1.6
          ports:
            - containerPort: 11211
          # No liveness/readiness exec probe here — memcached has no
          # simple CLI healthcheck out of the box. A TCP socket check is
          # the pragmatic equivalent: "can I even open a connection".
          readinessProbe:
            tcpSocket:
              port: 11211
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 11211
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: capstone
spec:
  type: ClusterIP # internal only, matches CACHE_HOST=memcached in 01-configmap.yaml
  selector:
    app: memcached
  ports:
    - port: 11211
      targetPort: 11211
