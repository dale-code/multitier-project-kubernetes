# All connection settings come from environment variables with sane
# localhost defaults, so the SAME build runs in Vagrant, Compose, and GCP
# by changing only the environment — never the code.

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Memcached (consumed by MemcachedConfig) ---
cache.host=${CACHE_HOST:localhost}
cache.port=${CACHE_PORT:11211}

# --- RabbitMQ ---
spring.rabbitmq.host=${BROKER_HOST:localhost}
spring.rabbitmq.port=${BROKER_PORT:5672}
spring.rabbitmq.username=${BROKER_USER:guest}
spring.rabbitmq.password=${BROKER_PASSWORD:guest}

# --- Actuator: exposes /actuator/health for readiness probes ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
